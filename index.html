<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>RipDaddy</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ripdaddy-theme");
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (_e) {}
      })();
    </script>
  </head>
  <body
    class="bg-[#FAF8F4] text-[#1A1513] antialiased selection:bg-[#4CDE99]/35 selection:text-[#1A1513] dark:bg-[#120E0D] dark:text-[#F5EFE8] dark:selection:text-[#F5EFE8]"
  >
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
