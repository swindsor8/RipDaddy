name: CI

on:
  push:
  pull_request:

jobs:
  check-and-test:
    name: Frontend Check & Rust Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Svelte & TypeScript check
        run: npm run check

      - name: Build frontend bundle (required by tauri::generate_context!)
        run: npm run build

      - name: Run Rust cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
