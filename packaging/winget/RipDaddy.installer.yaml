# Starter WinGet installer manifest template for RipDaddy.
# Declaring PackageDependencies tells winget to automatically install upstream
# HandBrakeCLI and MakeMKV alongside RipDaddy without bundling either binary.
# InstallerSha256 is auto-populated by `.github/workflows/release.yml` when tagging `v*`
# (or locally via `python3 scripts/update-packaging-manifests.py --from-release`).
PackageIdentifier: swindsor8.RipDaddy
PackageVersion: 0.1.1
InstallerLocale: en-US
InstallerType: nullsoft
Scope: user
Dependencies:
  PackageDependencies:
    - PackageIdentifier: HandBrake.HandBrake.CLI
    - PackageIdentifier: GuinpinSoft.MakeMKV
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/swindsor8/RipDaddy/releases/download/v0.1.1/RipDaddy_0.1.1_x64-setup.exe
    InstallerSha256: C60E598A2589991681B82B4712221A6A38DDADC2C9FC27652A36A5F468AD5229
ManifestType: installer
ManifestVersion: 1.6.0
